
# Site-wide settings
# ------------------
#
# title: Your awesome title
#
# author:
#   name: GitHub User
#   email: your-email@domain.com
#
# The `>` after `description:` means to ignore line-breaks until next key. If
#   you wish to omit the line-break after the end of text, use `>-` instead.
# description: >
#   Write an awesome description for your new site here. You can edit this line
#   in _config.yml. It will appear in your document head meta (for Google search
#   results) and in your feed.xml site description.

title: PVO
owner_name: Open Coding Society 
github_username: open-coding-society 
github_repo: "pages" 
# The site is served at the root of its custom domain (GitHub repo Settings > Pages >
# Custom domain), so baseurl is empty. If the custom domain is ever removed and the site
# goes back to aadis12.github.io/PVO-Frontend/, set baseurl back to "/PVO-Frontend".
url: "https://pvoteam.opencodingsociety.com"
baseurl: ""
future: true

# Exclude from Jekyll watch - these are processed by our conversion scripts
# This prevents double-regeneration when saving notebooks/docx files
exclude:
# Jekyll defaults
  - vendor
# Custom excludes
  - Makefile
  - _notebooks
  - _docx
  - venv


# Build settings
# --------------
#
# If you wish to use the gem-version of Minima with or without a Gemfile, use
#   the following setting:
# theme: minima
#
# **OR** if you wish to use the theme directly from the GitHub repository by
#   bypassing a Gemfile, use the following setting instead.
#   It is best that you lock to a particular commit and update if uptream changes
#   do not affect your site adversely.
# remote_theme: jekyll/minima@d4d779a
#
# Minima requires the following plugins:
# plugins:
#  - jekyll-feed
#  - jekyll-seo-tag
#
# Uncomment the following setting if you wish to disable deprecation warnings
#   from newer versions of sass converter. Adapt as required.
# sass:
#   quiet_deps: true
#   silence_deprecations: [import]
incremental: true

remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Minima-specific settings (applicable to Minima v3 and above only)
# -----------------------------------------------------------------
#
#  *All described config keys below should be nested under the top-level
#   `minima` key.*
#
# minima:
#   Minima skin selection. Available skins are:
#     * classic            Default, light color scheme.
#     * dark               Dark variant of the classic skin.
#     * auto               Adaptive skin based on the classic and dark skins.
#     * solarized-light    Light variant of solarized color scheme.
#     * solarized-dark     Dark variant of solarized color scheme.
#     * solarized          Adaptive skin for solarized color scheme skins.
#   skin: auto
#
#   Specific pages for site navigation.
#     If you wish to link only specific pages in the site-navigation, use this
#     and list the `path` property (as represented via Liquid) of the pages in
#     the order they should be rendered.
#   nav_pages:
#     - about.md
#
#   Set to `true` to show excerpts on the homepage.
#   show_excerpts: false
#
#   Minima date format.
#     The default value is "%b %d, %Y" (e.g. Nov 14, 2023).
#     Refer to https://shopify.github.io/liquid/filters/date/ for valid values
#   date_format: "%b-%d-%Y"
#
#   Social Media Links.
#     Renders icons via Font Awesome Free webfonts CDN, based on ordered list of
#     entries. Valid entry keys:
#       * title    Tooltip rendered on hovering over icon.
#       * icon     Font Awesome icon id. `github` corresponds to `fa-github`.
#       * url      Full URL of social profile.
#   social_links:
#     - title: Minima Theme repository at GitHub
#       icon: github
#       url: "https://github.com/jekyll/minima"
#     - title: Jekyll at X (formerly Twitter)
#       icon: x-twitter
#       url: "https://x.com/jekyllrb"
#
#   Hide syndication feed subscription link.
#     RSS / Atom feed link is always rendered as the last item of social-links
#     list. Set below key to `true` to not have the link to feed rendered as
#     part of social-links list.
#   hide_site_feed_link: false

minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/open-coding-society" }
    - { platform: x, user_url: "https://x.com/Open_Coding" }
    - { platform: youtube, user_url: "https://www.youtube.com/@OpenCodingSociety" } 
  nav_pages:
    - navigation/search.md
    - navigation/course.md
    - navigation/calendar.md
    - navigation/about.md
    - navigation/member-login.md

# PVO site menu
# -------------
# Builds the header and footer of every page that uses `layout: pvo`.
#   url       Site paths like "/volunteer" get the baseurl added automatically.
#             Full links (https://, mailto:, tel:) are used as written; https:// opens in a new tab.
#   children  Turns the item into a drop-down menu. `note` is the short line under each link.
#   show      Account items only: signed-out, signed-in, or admin.
#   greet     Account item shown as "Welcome, <name>" in the header once signed in.
# PVO menu: the left sidebar on every PVO page (OCS Aesthetihawk layout,
# _includes/aesthetihawk/sidebar.html). Sections and items appear in this order.
#   id     names the item; a page with `active_tab: <id>` highlights it
#   icon   a name from _data/aesthetihawk_icons.yml
#   show   signed-in / signed-out / staff (administrators and event organizers): who sees it
# Restart `jekyll serve` after editing this file.
pvo_menu:
  - section: Poway Veterans
    items:
      - { id: home, title: Home, url: /, icon: home }
      - { id: events, title: Events calendar, url: /#calendar, icon: calendar }
      - { id: gallery, title: Photos & videos, url: /gallery/, icon: image }
      - { id: about, title: About PVO, url: /#about, icon: flag }
      - { id: accessibility, title: Accessibility, url: /accessibility/, icon: access }
  - section: Get help
    items:
      - { id: prescreener, title: Request assistance, url: /prescreener, icon: hammer }
      - { id: resources, title: Resource Hub, url: /resources/, icon: book }
      - { id: jobs, title: Employment Board, url: /jobs/, icon: briefcase }
      - { id: assistant, title: Ask the assistant, url: /pvo-chatbot/, icon: chat }
      - { id: contact, title: Contact PVO, url: "mailto:contact@powayveterans.org", icon: mail }
  - section: Get involved
    items:
      - { id: volunteer, title: Volunteer, url: /volunteer, icon: hands }
      - { id: survey, title: Veteran survey, url: /member-profile/#survey, icon: clipboard }
      - { id: donate, title: Donate, url: "https://powayveterans.org/donate/", icon: heart }
  - section: Members
    items:
      - { id: login, title: Member Login, url: /member-login/, icon: login, show: signed-out }
      - { id: profile, title: My Profile, url: /member-profile/, icon: user, show: signed-in }
      - { id: admin, title: Admin Tools, url: /admin/, icon: key, show: staff }

pvo_contact:
  phone: "(858) 206-8854"
  phone_link: "tel:+18582068854"
  email: contact@powayveterans.org
  website: https://powayveterans.org/

sass:
  sass_dir: _sass